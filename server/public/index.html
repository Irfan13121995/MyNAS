<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Personal NAS — Dashboard</title>
  <meta name="description" content="Personal NAS Windows Dashboard — manage your storage, files, backup and remote access." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1.2" />
</head>
<body>

  <!-- ── SIDEBAR BACKDROP FOR MOBILE ── -->
  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

  <!-- ── LOGIN OVERLAY ── -->
  <div id="login-overlay" class="login-overlay hidden">
    <div class="login-card">
      <div class="login-logo">
        <img src="/assets/logo.png" style="height:44px;width:auto;border-radius:10px" alt="myNAS Logo" />
        <span style="display:none">myNAS</span>
      </div>
      <h2 id="auth-heading">Welcome back</h2>
      <p class="login-subtitle">Enter your passcode to access the dashboard</p>
      
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Login</div>
        <div class="auth-tab" data-tab="register">Create Account</div>
      </div>

      <div id="login-error" class="login-error hidden"></div>
      <div id="register-error" class="login-error hidden"></div>

      <div id="tab-login" class="auth-tab-content active">
        <form id="login-form" autocomplete="off">
          <label class="pin-header-label">Enter 6-digit authentication code</label>
          <div class="pin-input-row" id="pin-input-row">
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="0" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="1" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="2" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="3" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="4" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="5" autocomplete="off" />
          </div>
          <input id="passcode-input" type="hidden" name="passcode" />

          <button type="submit" id="login-btn" class="btn btn-primary btn-full">
            <span id="login-btn-text">Verify & Unlock</span>
            <span id="login-spinner" class="spinner hidden"></span>
          </button>
        </form>
        
        <div class="login-divider">or</div>
        
        <label for="username-input">Username</label>
        <div class="input-group">
          <input id="username-input" class="input" type="text" placeholder="Username" autocomplete="username" />
        </div>
        <label for="password-input">Password</label>
        <div class="input-group">
          <input id="password-input" class="input" type="password" placeholder="Password" autocomplete="current-password" style="margin-bottom: 20px" />
        </div>
        <button type="button" id="login-account-btn" class="btn btn-primary btn-full">
          <span>Login with Account</span>
        </button>
      </div>

      <div id="tab-register" class="auth-tab-content">
        <label for="reg-username">Username</label>
        <div class="input-group">
          <input id="reg-username" class="input" type="text" placeholder="Choose a username" autocomplete="username" />
        </div>
        <label for="reg-password">Password</label>
        <div class="input-group">
          <input id="reg-password" class="input" type="password" placeholder="Min 6 characters" autocomplete="new-password" />
        </div>
        <label for="reg-confirm">Confirm Password</label>
        <div class="input-group">
          <input id="reg-confirm" class="input" type="password" placeholder="Confirm password" autocomplete="new-password" style="margin-bottom: 20px" />
        </div>
        <button type="button" id="register-btn" class="btn btn-primary btn-full">
          <span>Create Account & Login</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── MAIN APP SHELL ── -->
  <div id="app" class="app-shell hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="/assets/logo.png" style="height:36px;width:auto;border-radius:8px" alt="myNAS Logo" />
        <div class="sidebar-logo-text">
          <span class="sidebar-logo-title">myNAS</span>
          <span class="sidebar-logo-sub">Private Cloud</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>
        <a href="#" class="nav-item" data-page="storage">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
          </svg>
          Storage
        </a>
        <a href="#" class="nav-item" data-page="files">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          Files
        </a>
        <a href="#" class="nav-item" data-page="gallery">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          Gallery
        </a>
        <a href="#" class="nav-item" data-page="backup">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
          Backup
        </a>
        <a href="#" class="nav-item" data-page="remote">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Remote Access
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-server-info" id="sidebar-server-info">
          <span class="status-dot online"></span>
          <span id="sidebar-ip">Loading...</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="main-area">

      <!-- TOPBAR -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
        <div class="topbar-actions">
          <div class="tunnel-badge hidden" id="tunnel-badge">
            <span class="status-dot online"></span>
            <span>Tunnel Active</span>
          </div>
          <div class="user-profile-badge" id="user-profile-badge">
            <span class="user-icon">👤</span>
            <span id="username-display">Irfan.Ahmed</span>
          </div>
          <div class="passcode-badge" id="passcode-badge" title="Click eye icon to show/hide passcode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span id="passcode-display">••••••</span>
            <button id="toggle-passcode-btn" class="passcode-eye-btn" aria-label="Toggle passcode visibility" title="Show passcode">👁️</button>
          </div>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="content" id="content">
        <div class="page-loading">
          <div class="spinner large"></div>
          <p>Loading...</p>
        </div>
      </main>

    </div>
  </div>

  <!-- ── MODAL ROOT ── -->
  <div id="modal-root"></div>

  <!-- ── TOAST ROOT ── -->
  <div id="toast-root"></div>

  <script src="app.js?v=1.2"></script>
</body>
</html>
