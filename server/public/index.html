<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Personal NAS — Dashboard</title>
  <meta name="description" content="Personal NAS Windows Dashboard — manage your storage, files, backup and remote access." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=8.9" />
</head>
<body>

  <!-- ── SIDEBAR BACKDROP FOR MOBILE ── -->
  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

  <!-- ── LOGIN OVERLAY ── -->
  <div id="login-overlay" class="login-overlay hidden">
    <div class="login-card">
      <div class="login-logo">
        <img src="/assets/logo.png" style="width:52px;height:52px;object-fit:cover;border-radius:14px;box-shadow:0 0 16px rgba(0,212,255,0.4)" alt="myNAS Logo" />
        <span style="display:none">myNAS</span>
      </div>
      <h2 id="auth-heading">Welcome back</h2>
      <p class="login-subtitle">Enter your passcode to access the dashboard</p>
      
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Login</div>
        <div class="auth-tab" data-tab="register">Create Account</div>
      </div>

      <div id="login-error" class="login-error hidden"></div>
      <div id="register-error" class="login-error hidden"></div>

      <div id="tab-login" class="auth-tab-content active">
        <form id="login-form" autocomplete="off">
          <label class="pin-header-label">Enter 6-digit authentication code</label>
          <div class="pin-input-row" id="pin-input-row">
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="0" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="1" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="2" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="3" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="4" autocomplete="off" />
            <input type="text" maxlength="1" inputmode="numeric" class="pin-box" data-idx="5" autocomplete="off" />
          </div>
          <input id="passcode-input" type="hidden" name="passcode" />

          <button type="submit" id="login-btn" class="btn btn-primary btn-full">
            <span id="login-btn-text">Verify & Unlock</span>
            <span id="login-spinner" class="spinner hidden"></span>
          </button>
        </form>
        
        <div class="login-divider">or</div>
        
        <label for="username-input">Username</label>
        <div class="input-group">
          <input id="username-input" class="input" type="text" placeholder="Username" autocomplete="username" />
        </div>
        <label for="password-input">Password</label>
        <div class="input-group">
          <input id="password-input" class="input" type="password" placeholder="Password" autocomplete="current-password" style="margin-bottom: 20px" />
        </div>
        <button type="button" id="user-login-btn" class="btn btn-ghost btn-full">
          <span>Login with Password</span>
        </button>
      </div>

      <div id="tab-register" class="auth-tab-content">
        <label for="reg-username">Username</label>
        <div class="input-group">
          <input id="reg-username" class="input" type="text" placeholder="Choose a username" autocomplete="username" />
        </div>
        <label for="reg-password">Password</label>
        <div class="input-group">
          <input id="reg-password" class="input" type="password" placeholder="Min 6 characters" autocomplete="new-password" />
        </div>
        <label for="reg-confirm">Confirm Password</label>
        <div class="input-group">
          <input id="reg-confirm" class="input" type="password" placeholder="Confirm password" autocomplete="new-password" style="margin-bottom: 20px" />
        </div>
        <button type="button" id="register-btn" class="btn btn-primary btn-full">
          <span>Create Account & Login</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── MAIN APP SHELL ── -->
  <div id="app" class="app-shell hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="/assets/logo.png" style="width:36px;height:36px;object-fit:cover;border-radius:10px" alt="myNAS Logo" />
        <div class="sidebar-logo-text">
          <span class="sidebar-logo-title">myNAS</span>
          <span class="sidebar-logo-sub">Private Cloud</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="storage">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/>
          </svg>
          <span>Storage</span>
        </a>
        <a href="#" class="nav-item" data-page="files">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Files</span>
        </a>
        <a href="#" class="nav-item" data-page="gallery">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>Gallery</span>
        </a>
        <a href="#" class="nav-item" data-page="backup">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span>Backup</span>
        </a>
        <a href="#" class="nav-item" data-page="remote">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span>Remote Access</span>
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </a>
        <a href="#" class="nav-item hidden" data-page="admin" id="nav-item-admin">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Admin Panel</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-ip font-mono" id="sidebar-ip">127.0.0.1:3000</div>
        <button id="logout-btn" class="btn btn-ghost btn-sm btn-full" title="Log Out">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">

      <!-- TOPBAR -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
        <div class="topbar-actions">
          <div id="topbar-theme-switch" class="custom-theme-switch" role="button" tabindex="0" title="Toggle Light/Dark Mode">
            <div class="switch-track">
              <span class="switch-label dark-label">DARK</span>
              <div class="switch-thumb">
                <svg class="icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4"></circle>
                  <line x1="12" y1="2" x2="12" y2="5"></line>
                  <line x1="12" y1="19" x2="12" y2="22"></line>
                  <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"></line>
                  <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"></line>
                  <line x1="2" y1="12" x2="5" y2="12"></line>
                  <line x1="19" y1="12" x2="22" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"></line>
                  <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                  <path d="M18 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="currentColor" stroke="none"></path>
                  <path d="M14 2l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z" fill="currentColor" stroke="none"></path>
                </svg>
              </div>
              <span class="switch-label light-label">LIGHT</span>
            </div>
          </div>
          <div class="tunnel-badge hidden" id="tunnel-badge">
            <span class="status-dot online"></span>
            <span>Tunnel Active</span>
          </div>
          <div class="user-profile-badge" id="user-profile-badge">
            <span class="user-icon">👤</span>
            <span id="username-display">Irfan.Ahmed</span>
            <span id="role-badge" class="role-badge role-admin hidden">Admin</span>
          </div>
        </div>
      </header>

      <!-- CONTENT -->
      <main class="content" id="content">
        <div class="page-loading">
          <div class="spinner large"></div>
          <p>Loading...</p>
        </div>
      </main>

    </div>
  </div>

  <!-- ── MODAL ROOT ── -->
  <div id="modal-root"></div>

  <!-- ── TOAST ROOT ── -->
  <div id="toast-root"></div>

  <script src="app.js?v=8.9"></script>
</body>
</html>
